{% extends 'base.html' %}

{% block title %}Add Product | Trendify{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="border p-4 bg-white shadow-sm">
        <h3 class="mb-4 text-center fw-bold" style="letter-spacing: 1px;">ADD NEW PRODUCT</h3>
        
        <form method="POST" action="{{ url_for('add_product') }}">
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase">Product Name</label>
                <input type="text" name="name" class="form-control rounded-0" required placeholder="e.g. Walkend Sneakers">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold small text-uppercase">Sale Price (PKR)</label>
                    <input type="number" step="0.01" name="price" class="form-control rounded-0" required placeholder="1399">
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold small text-uppercase">Original Price (Cut Price)</label>
                    <input type="number" step="0.01" name="old_price" class="form-control rounded-0" placeholder="2599">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase">Image Path</label>
                <input type="text" name="image" class="form-control rounded-0" required placeholder="/static/images/tracksuit.png">
                <div class="form-text small text-danger">
                    <strong>Zaroori:</strong> Pehle image file ko <code>static/images/</code> folder mein rakho, phir yahan path likho.<br>
                    Example: <code>/static/images/tracksuit.png</code>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase">Category</label>
                <select name="category" class="form-select rounded-0" required>
                    <option value="Shoes">Shoes</option>
                    <option value="Watches">Watches</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Hair Care">Hair Care</option>
                    <option value="Electronics">Electronics</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small text-uppercase">Description</label>
                <textarea name="description" class="form-control rounded-0" rows="4" required placeholder="Product details..."></textarea>
            </div>

            <button type="submit" class="btn btn-dark rounded-0 w-100 py-3 fw-bold text-uppercase" style="letter-spacing: 1px;">SAVE PRODUCT</button>
        </form>
    </div>
</div>
{% endblock %}
