{% extends "base.html" %}

{% block title %}Edit Product | Trendify{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <h2 class="mb-4 text-center">Edit Product</h2>
    
    <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label fw-bold">Product Name</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Price (Rs.)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Old Price (Optional)</label>
                <input type="number" step="0.01" name="old_price" class="form-control" value="{{ product.old_price or '' }}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Image Path</label>
            <input type="text" name="image" class="form-control" value="{{ product.image }}" required>
            <div class="form-text small">Example: /static/images/tracksuit.png (file must exist in static/images folder)</div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea name="description" class="form-control" rows="4" required>{{ product.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold">Update Product</button>
    </form>
</div>
{% endblock %}
